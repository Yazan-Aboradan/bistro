<!DOCTYPE html>
<html>
  <head>
    <base href="/" />

    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Bistro Menu Progressive Web App" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Bistro App" />
    <meta name="theme-color" content="#253F25" />

    <!-- App Icon -->
    <link rel="apple-touch-icon" sizes="57x57" href="assets/assets/images/Bistro_logo.png" />
    <link rel="icon" type="image/png" href="assets/assets/images/Bistro_logo.png" sizes="16x16" />

    <link rel="manifest" href="manifest.json" />
    <title>Bistro App</title>

    <!-- Preload critical assets for faster rendering -->
    <link rel="preload" href="assets/assets/images/Bistro_Logo.svg" as="image" />
    <link rel="preload" href="assets/assets/images/background_0_mobile.png" as="image" />
    <link rel="preload" href="assets/assets/images/background_0_ipad.png" as="image" />

    <script>
      (function () {
        var isStandalone = window.matchMedia && window.matchMedia('(display-mode: standalone)').matches;
        var isIosStandalone = window.navigator && window.navigator.standalone;
        var isMobileBrowser = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent || '');

        if (isMobileBrowser || isStandalone || isIosStandalone) {
          document.documentElement.classList.add('skip-splash');
        }
      })();
    </script>

    <!-- Native splash: visible INSTANTLY before Flutter engine loads -->
    <style>
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background-color: #253F25;
      }

      html.skip-splash,
      html.skip-splash body {
        overflow: auto;
        background-color: #e9e9e7;
      }

      /* Native splash screen — pure CSS, zero JS, shows immediately */
      #splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #253F25;
        transition: opacity 0.3s ease-out;
      }

      html.skip-splash #splash {
        display: none;
      }

      #splash.hidden {
        opacity: 0;
        pointer-events: none;
      }

      #splash img {
        width: 120px;
        height: 120px;
        object-fit: contain;
      }

      /* Simple CSS spinner — no external assets needed */
      .spinner {
        margin-top: 28px;
        width: 32px;
        height: 32px;
        border: 3px solid rgba(255, 255, 255, 0.2);
        border-top-color: #253F25;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <!-- This shows BEFORE any JS or Flutter loads -->
    <div id="splash">
      <img src="assets/assets/images/Bistro_logo.png" alt="Bistro" />
      <div class="spinner"></div>
    </div>

    <script src="flutter_bootstrap.js" async></script>
  </body>
</html>
